;background:#12131d;padding:20px\">\n          <svg sc-camel-view-box=\"0 0 880 430\" style=\"width:100%;height:auto\" font-family=\"Inter, sans-serif\">\n            <defs><marker id=\"arn\" sc-camel-marker-width=\"9\" sc-camel-marker-height=\"9\" sc-camel-ref-x=\"7\" sc-camel-ref-y=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#9184d9\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n            <rect x=\"330\" y=\"12\" width=\"220\" height=\"46\" rx=\"12\" fill=\"#232532\" stroke=\"#9397ab\"><\u002Frect><text x=\"440\" y=\"40\" fill=\"#e9e9ed\" font-size=\"14\" font-weight=\"600\" text-anchor=\"middle\">🌐 Người dùng / Internet<\u002Ftext>\n            <path d=\"M440,58 L200,96\" stroke=\"#9184d9\" stroke-width=\"1.5\" marker-end=\"url(#arn)\"><\u002Fpath><path d=\"M440,58 L440,96\" stroke=\"#9184d9\" stroke-width=\"1.5\" marker-end=\"url(#arn)\"><\u002Fpath><path d=\"M440,58 L680,96\" stroke=\"#9184d9\" stroke-width=\"1.5\" marker-end=\"url(#arn)\"><\u002Fpath>\n            <rect x=\"110\" y=\"100\" width=\"180\" height=\"52\" rx=\"10\" fill=\"#1b1d2b\" stroke=\"#5ec8d8\"><\u002Frect><text x=\"200\" y=\"131\" fill=\"#5ec8d8\" font-size=\"13.5\" font-weight=\"600\" text-anchor=\"middle\">NodePort<\u002Ftext>\n            <rect x=\"350\" y=\"100\" width=\"180\" height=\"52\" rx=\"10\" fill=\"#1b1d2b\" stroke=\"#9184d9\"><\u002Frect><text x=\"440\" y=\"131\" fill=\"#d2cefd\" font-size=\"13.5\" font-weight=\"600\" text-anchor=\"middle\">LoadBalancer<\u002Ftext>\n            <rect x=\"590\" y=\"100\" width=\"180\" height=\"52\" rx=\"10\" fill=\"#1b1d2b\" stroke=\"#e0b15e\"><\u002Frect><text x=\"680\" y=\"125\" fill=\"#e0b15e\" font-size=\"13.5\" font-weight=\"600\" text-anchor=\"middle\">Ingress<\u002Ftext><text x=\"680\" y=\"142\" fill=\"#9397ab\" font-size=\"10\" text-anchor=\"middle\">HTTP/HTTPS routing<\u002Ftext>\n            <path d=\"M200,152 L430,196\" stroke=\"#9184d9\" stroke-width=\"1.4\" marker-end=\"url(#arn)\"><\u002Fpath><path d=\"M440,152 L440,196\" stroke=\"#9184d9\" stroke-width=\"1.4\" marker-end=\"url(#arn)\"><\u002Fpath><path d=\"M680,152 L450,196\" stroke=\"#9184d9\" stroke-width=\"1.4\" marker-end=\"url(#arn)\"><\u002Fpath>\n            <rect x=\"300\" y=\"200\" width=\"280\" height=\"54\" rx=\"10\" fill=\"#423a6a\" stroke=\"#9184d9\"><\u002Frect><text x=\"440\" y=\"226\" fill=\"#f5f4ff\" font-size=\"14\" font-weight=\"600\" text-anchor=\"middle\">Service (ClusterIP)<\u002Ftext><text x=\"440\" y=\"244\" fill=\"#cdc7f5\" font-size=\"10.5\" text-anchor=\"middle\">cân bằng tải nội bộ<\u002Ftext>\n            <path d=\"M440,254 L200,320\" stroke=\"#9184d9\" stroke-width=\"1.4\" marker-end=\"url(#arn)\"><\u002Fpath><path d=\"M440,254 L440,320\" stroke=\"#9184d9\" stroke-width=\"1.4\" marker-end=\"url(#arn)\"><\u002Fpath><path d=\"M440,254 L680,320\" stroke=\"#9184d9\" stroke-width=\"1.4\" marker-end=\"url(#arn)\"><\u002Fpath>\n            <g><rect x=\"130\" y=\"324\" width=\"140\" height=\"70\" rx=\"10\" fill=\"#1b1d2b\" stroke=\"#7fd1a3\"><\u002Frect><text x=\"200\" y=\"365\" fill=\"#e9e9ed\" font-size=\"13\" text-anchor=\"middle\">Pod<\u002Ftext><\u002Fg>\n            <g><rect x=\"370\" y=\"324\" width=\"140\" height=\"70\" rx=\"10\" fill=\"#1b1d2b\" stroke=\"#7fd1a3\"><\u002Frect><text x=\"440\" y=\"365\" fill=\"#e9e9ed\" font-size=\"13\" text-anchor=\"middle\">Pod<\u002Ftext><\u002Fg>\n            <g><rect x=\"610\" y=\"324\" width=\"140\" height=\"70\" rx=\"10\" fill=\"#1b1d2b\" stroke=\"#7fd1a3\"><\u002Frect><text x=\"680\" y=\"365\" fill=\"#e9e9ed\" font-size=\"13\" text-anchor=\"middle\">Pod<\u002Ftext><\u002Fg>\n          <\u002Fsvg>\n          <figcaption style=\"padding-top:8px;color:var(--color-neutral-500)\">Traffic từ ngoài đi qua NodePort / LoadBalancer / Ingress → Service → phân phối tới các Pod.<\u002Ffigcaption>\n        <\u002Ffigure>\n\n        <div class=\"km-grid2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px\">\n          <div class=\"card elev-sm\"><div class=\"card-title\" style=\"font-size:15px;color:#e0b15e\">Ingress<\u002Fdiv><div class=\"card-body\">Quản lý truy cập HTTP/HTTPS, cấu hình luật routing để điều hướng lưu lượng vào đúng dịch vụ. Cần một Ingress Controller.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\"><div class=\"card-title\" style=\"font-size:15px;color:#5ec8d8\">NodePort<\u002Fdiv><div class=\"card-body\">Mở một cổng tĩnh trên mỗi node, ánh xạ tới cổng của Pod. Truy cập qua IP node + cổng.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 10 -->\n      <section id=\"hoat-dong\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:56px 0 8px;border-top:1px solid var(--color-divider);margin-top:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">10<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">HOW IT WORKS · HOẠT ĐỘNG<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:34px;margin:0 0 14px\">Kubernetes hoạt động thế nào?<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.65;color:var(--color-neutral-300);max-width:720px\">Mọi yêu cầu đi qua API Server. Controller Manager &amp; Scheduler xử lý &amp; điều phối Pod tới Worker Node; Kubelet chạy container, Kube-proxy lo mạng.<\u002Fp>\n\n        <figure class=\"km-diagram\" style=\"margin:24px 0 8px;border:1px solid var(--color-divider);border-radius:14px;background:#12131d;padding:22px 20px\">\n          <svg sc-camel-view-box=\"0 0 980 150\" style=\"width:100%;height:auto\" font-family=\"Inter, sans-serif\">\n            <defs><marker id=\"arf\" sc-camel-marker-width=\"10\" sc-camel-marker-height=\"10\" sc-camel-ref-x=\"7\" sc-camel-ref-y=\"3.2\" orient=\"auto\"><path d=\"M0,0 L7,3.2 L0,6.4 Z\" fill=\"#5ec8d8\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n            <g>\n              <rect x=\"6\" y=\"40\" width=\"168\" height=\"70\" rx=\"12\" fill=\"#1b1d2b\" stroke=\"#9184d9\"><\u002Frect><text x=\"90\" y=\"70\" fill=\"#d2cefd\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\">1 · kubectl apply<\u002Ftext><text x=\"90\" y=\"90\" fill=\"#9397ab\" font-size=\"11\" text-anchor=\"middle\">gửi file YAML<\u002Ftext>\n              <path d=\"M178,75 L204,75\" stroke=\"#5ec8d8\" stroke-width=\"2\" marker-end=\"url(#arf)\"><\u002Fpath>\n              <rect x=\"208\" y=\"40\" width=\"168\" height=\"70\" rx=\"12\" fill=\"#1b1d2b\" stroke=\"#9184d9\"><\u002Frect><text x=\"292\" y=\"70\" fill=\"#d2cefd\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\">2 · API Server<\u002Ftext><text x=\"292\" y=\"90\" fill=\"#9397ab\" font-size=\"11\" text-anchor=\"middle\">nhận &amp; lưu etcd<\u002Ftext>\n              <path d=\"M380,75 L406,75\" stroke=\"#5ec8d8\" stroke-width=\"2\" marker-end=\"url(#arf)\"><\u002Fpath>\n              <rect x=\"410\" y=\"40\" width=\"168\" height=\"70\" rx=\"12\" fill=\"#1b1d2b\" stroke=\"#7fd1a3\"><\u002Frect><text x=\"494\" y=\"70\" fill=\"#e9e9ed\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\">3 · Scheduler<\u002Ftext><text x=\"494\" y=\"90\" fill=\"#9397ab\" font-size=\"11\" text-anchor=\"middle\">chọn Node<\u002Ftext>\n              <path d=\"M582,75 L608,75\" stroke=\"#5ec8d8\" stroke-width=\"2\" marker-end=\"url(#arf)\"><\u002Fpath>\n              <rect x=\"612\" y=\"40\" width=\"168\" height=\"70\" rx=\"12\" fill=\"#1b1d2b\" stroke=\"#5ec8d8\"><\u002Frect><text x=\"696\" y=\"70\" fill=\"#e9e9ed\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\">4 · Kubelet<\u002Ftext><text x=\"696\" y=\"90\" fill=\"#9397ab\" font-size=\"11\" text-anchor=\"middle\">tạo container<\u002Ftext>\n              <path d=\"M784,75 L810,75\" stroke=\"#5ec8d8\" stroke-width=\"2\" marker-end=\"url(#arf)\"><\u002Fpath>\n              <rect x=\"814\" y=\"40\" width=\"160\" height=\"70\" rx=\"12\" fill=\"#233b2e\" stroke=\"#7fd1a3\"><\u002Frect><text x=\"894\" y=\"70\" fill=\"#7fd1a3\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\">5 · Pod chạy ✓<\u002Ftext><text x=\"894\" y=\"90\" fill=\"#9397ab\" font-size=\"11\" text-anchor=\"middle\">sẵn sàng phục vụ<\u002Ftext>\n            <\u002Fg>\n          <\u002Fsvg>\n          <figcaption style=\"padding-top:10px;color:var(--color-neutral-500)\">Vòng đời một lần triển khai — từ lệnh của bạn đến khi Pod chạy.<\u002Ffigcaption>\n        <\u002Ffigure>\n\n        <div class=\"km-grid2\" style=\"display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start;margin-top:18px\">\n          <div style=\"border-left:3px solid #5ec8d8;background:linear-gradient(90deg,color-mix(in srgb,#5ec8d8 10%,transparent),transparent);border-radius:0 12px 12px 0;padding:16px 20px\">\n            <div style=\"font:600 12px Inter;letter-spacing:.08em;color:#5ec8d8;margin-bottom:6px\">🎯 VÍ DỤ THỰC TẾ — deploy web nginx 3 bản<\u002Fdiv>\n            <p style=\"margin:0 0 8px;font-size:14.5px;line-height:1.6;color:var(--color-neutral-200)\">Bạn chạy <code style=\"background:#232532;padding:2px 6px;border-radius:5px;color:#5ec8d8\">kubectl apply -f web.yaml<\u002Fcode> với <b>replicas: 3<\u002Fb>. K8s tạo 3 Pod nginx trên các node khác nhau. Nếu 1 Pod chết → K8s tự tạo Pod mới để giữ đủ 3. Tải tăng → tăng lên 6 Pod. Muốn cập nhật → rolling update, lỗi thì rollback.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;gap:10px;align-items:center;background:var(--color-surface);border-radius:10px;padding:10px 14px\"><span style=\"font-size:16px\">♻️<\u002Fspan><div style=\"font:13px/1.4 Inter;color:var(--color-neutral-200)\"><b style=\"color:var(--color-text)\">Quản lý vòng đời:<\u002Fb> luôn giữ container chạy, tự restart.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:10px;align-items:center;background:var(--color-surface);border-radius:10px;padding:10px 14px\"><span style=\"font-size:16px\">📈<\u002Fspan><div style=\"font:13px/1.4 Inter;color:var(--color-neutral-200)\"><b style=\"color:var(--color-text)\">Tự mở rộng:<\u002Fb> tăng/giảm Pod theo tải.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:10px;align-items:center;background:var(--color-surface);border-radius:10px;padding:10px 14px\"><span style=\"font-size:16px\">⚖️<\u002Fspan><div style=\"font:13px/1.4 Inter;color:var(--color-neutral-200)\"><b style=\"color:var(--color-text)\">Cân bằng tải:<\u002Fb> chia đều traffic cho Pod.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:10px;align-items:center;background:var(--color-surface);border-radius:10px;padding:10px 14px\"><span style=\"font-size:16px\">↩️<\u002Fspan><div style=\"font:13px/1.4 Inter;color:var(--color-neutral-200)\"><b style=\"color:var(--color-text)\">Update &amp; Rollback:<\u002Fb> cập nhật an toàn, quay lui khi lỗi.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <figure style=\"margin:22px 0 0;border:1px solid var(--color-divider);border-radius:14px;overflow:hidden;background:#fff\">\n          <img src=\"c9287495-1411-49b9-b8b4-fd901a141d69\" alt=\"Sơ đồ hoạt động của Kubernetes: YAML tới Master, Master điều phối Worker\" style=\"width:100%\">\n          <figcaption style=\"padding:10px 16px;color:var(--color-neutral-500);background:#12131d\">Sơ đồ tham khảo từ tài liệu gốc: YAML → Master (API Server, Scheduler, Controller) → các Worker chạy Pod trên Docker.<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsection>\n\n      <!-- 11 -->\n      <section id=\"trien-khai\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:56px 0 8px;border-top:1px solid var(--color-divider);margin-top:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">11<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">DEPLOYMENT OPTIONS<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:34px;margin:0 0 14px\">Triển khai Kubernetes ở đâu?<\u002Fh2>\n        <div class=\"km-grid3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px\">\n          <div class=\"card elev-sm\" style=\"gap:10px\"><div style=\"font:600 13px Inter;color:#7fd1a3\">🖥️ Tự quản lý (self-managed)<\u002Fdiv><div class=\"card-body\"><b style=\"color:var(--color-text)\">kubeadm<\u002Fb> — dựng cụm từ đầu.<br><b style=\"color:var(--color-text)\">K3s<\u002Fb> — bản nhẹ cho IoT / môi trường tài nguyên hạn chế.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"gap:10px\"><div style=\"font:600 13px Inter;color:#5ec8d8\">☁️ Dịch vụ cloud<\u002Fdiv><div class=\"card-body\"><b style=\"color:var(--color-text)\">GKE<\u002Fb> — Google.<br><b style=\"color:var(--color-text)\">EKS<\u002Fb> — AWS.<br><b style=\"color:var(--color-text)\">AKS<\u002Fb> — Microsoft Azure.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"gap:10px\"><div style=\"font:600 13px Inter;color:#9184d9\">🛠️ Công cụ tự động<\u002Fdiv><div class=\"card-body\"><b style=\"color:var(--color-text)\">Rancher / Kubespray<\u002Fb> — triển khai &amp; vận hành cụm dễ dàng.<br><b style=\"color:var(--color-text)\">Helm<\u002Fb> — quản lý gói ứng dụng (charts).<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 12 -->\n      <section id=\"thuc-hanh\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:56px 0 8px;border-top:1px solid var(--color-divider);margin-top:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">12<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">PRACTICE · THỰC HÀNH<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:34px;margin:0 0 14px\">Thực hành<\u002Fh2>\n        <div class=\"km-grid2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px\">\n          <div style=\"border:1px solid var(--color-accent-700);border-radius:14px;padding:22px;background:linear-gradient(160deg,var(--color-accent-900),var(--color-surface))\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\"><span style=\"width:34px;height:34px;border-radius:9px;background:#423a6a;display:grid;place-items:center;font-size:16px\">①<\u002Fspan><div style=\"font:600 17px Inter;color:var(--color-text)\">Triển khai K8s bằng Kubespray<\u002Fdiv><\u002Fdiv>\n            <p style=\"margin:0;font:14px/1.6 Inter;color:var(--color-neutral-300)\">Dựng một cụm Kubernetes hoàn chỉnh trên nhiều máy chủ bằng công cụ Kubespray (dựa trên Ansible).<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #2a6a6f;border-radius:14px;padding:22px;background:linear-gradient(160deg,#12292c,var(--color-surface))\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\"><span style=\"width:34px;height:34px;border-radius:9px;background:#12292c;border:1px solid #5ec8d8;display:grid;place-items:center;font-size:16px\">②<\u002Fspan><div style=\"font:600 17px Inter;color:var(--color-text)\">Triển khai web bằng Nginx trên cụm<\u002Fdiv><\u002Fdiv>\n            <p style=\"margin:0;font:14px/1.6 Inter;color:var(--color-neutral-300)\">Tạo Deployment + Service để chạy một website nginx và truy cập được từ bên ngoài cụm.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <div style=\"margin-top:56px;padding:36px;border-radius:18px;text-align:center;background:radial-gradient(600px 240px at 50% 0%, var(--color-section-glow), transparent 70%), var(--color-section)\">\n        <div style=\"font:600 30px Inter;color:#fff;margin-bottom:6px\">Q &amp; A<\u002Fdiv>\n        <p style=\"margin:0 0 18px;color:var(--color-accent-200)\">Bạn đã đi hết module Kubernetes cơ bản 🎉<\u002Fp>\n        <a href=\"#top\" class=\"btn btn-primary\" style=\"border-color:var(--color-accent-200);color:#fff;padding:10px 22px\">↑ Lên đầu trang<\u002Fa>\n        <div style=\"margin-top:26px;padding-top:18px;border-top:1px solid color-mix(in srgb,#fff 14%,transparent);font:12px Inter;color:var(--color-accent-200)\">Author: <b style=\"color:#fff\">Yên Nguyễn<\u002Fb> · © Yên Nguyễn — All Rights Reserved<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { active: 'gioi-thieu', progress: 0 };\n\n  componentDidMount() {\n    const secs = Array.from(document.querySelectorAll('section[data-toc]'));\n    this._obs = new IntersectionObserver((entries) => {\n      const vis = entries.filter(e => e.isIntersecting);\n      if (vis.length) {\n        vis.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);\n        this.setState({ active: vis[0].target.id });\n      }\n    }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });\n    secs.forEach(s => this._obs.observe(s));\n\n    this._onScroll = () => {\n      const el = document.documentElement;\n      const max = el.scrollHeight - el.clientHeight;\n      const p = max > 0 ? (el.scrollTop / max) * 100 : 0;\n      this.setState({ progress: Math.max(0, Math.min(100, p)) });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n\n  componentWillUnmount() {\n    if (this._obs) this._obs.disconnect();\n    window.removeEventListener('scroll', this._onScroll);\n  }\n\n  renderVals() {\n    const items = [\n      { id: 'gioi-thieu', num: '01', vi: 'Kubernetes là gì?', en: 'What is K8s' },\n      { id: 'ung-dung', num: '02', vi: 'Ứng dụng thực tế', en: 'Use cases' },\n      { id: 'kien-truc', num: '03', vi: 'Kiến trúc tổng quan', en: 'Architecture' },\n      { id: 'control-plane', num: '04', vi: 'Control Plane', en: 'Master components' },\n      { id: 'worker-node', num: '05', vi: 'Worker Node & kubectl', en: 'Worker & CLI' },\n      { id: 'doi-tuong', num: '06', vi: 'Đối tượng cốt lõi', en: 'Core objects' },\n      { id: 'luu-tru', num: '07', vi: 'Lưu trữ PV & PVC', en: 'Storage' },\n      { id: 'workload', num: '08', vi: 'DaemonSet & StatefulSet', en: 'Workloads' },\n      { id: 'networking', num: '09', vi: 'Networking & Service', en: 'Networking' },\n      { id: 'hoat-dong', num: '10', vi: 'K8s hoạt động thế nào', en: 'How it works' },\n      { id: 'trien-khai', num: '11', vi: 'Triển khai K8s', en: 'Deployment' },\n      { id: 'thuc-hanh', num: '12', vi: 'Thực hành', en: 'Practice' },\n    ];\n    const active = this.state.active;\n    const linkBase = {\n      display: 'flex', alignItems: 'flex-start', gap: '9px', padding: '7px 10px',\n      borderRadius: '8px', textDecoration: 'none', borderLeft: '2px solid transparent',\n      fontSize: '12.5px', lineHeight: '1.25', transition: 'background .15s,color .15s',\n    };\n    const numBase = { fontFamily: 'Inter', fontWeight: 600, fontSize: '11px', flex: 'none', paddingTop: '1px' };\n    const toc = items.map(it => {\n      const on = it.id === active;\n      return {\n        ...it,\n        style: on\n          ? { ...linkBase, color: '#e9e9ed', background: 'color-mix(in srgb, #9184d9 14%, transparent)', borderLeftColor: '#9184d9' }\n          : { ...linkBase, color: '#9397ab' },\n        numStyle: { ...numBase, color: on ? '#b5abfc' : '#595d6c' },\n      };\n    });\n    return {\n      toc,\n      progressStyle: { height: '100%', width: this.state.progress + '%', background: 'linear-gradient(90deg,#9184d9,#5ec8d8)', transition: 'width .1s linear' },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
