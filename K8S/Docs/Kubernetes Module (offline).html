document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-display: swap;\n  src: url(\"0b3e9329-11c9-40b7-a276-216e36ab9514\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5bd023a7-8b2b-42fe-ad82-9020e1995d60\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8e44b894-a516-405c-99fb-7449e49572e8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b7c0dae1-355a-4aa6-87dc-db193f2457fc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"efafe018-a8ee-45a5-bdea-529790c7dff5\"><\u002Fscript>\n  <style>\n    html{scroll-behavior:smooth}\n    body{margin:0;background:var(--color-bg)}\n    a{color:var(--color-accent-300);text-decoration:none}\n    a:hover{color:var(--color-accent-200)}\n    @keyframes kmFloat{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}\n    @keyframes kmDash{to{stroke-dashoffset:-16}}\n    @media(max-width:940px){.km-shell{grid-template-columns:1fr!important}.km-toc{display:none!important}}\n    @media(max-width:640px){.km-grid2,.km-grid3,.km-grid4{grid-template-columns:1fr!important}.km-hero-title{font-size:44px!important}}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:transparent\">\n  <div style=\"{{ progressStyle }}\"><\u002Fdiv>\n<\u002Fdiv>\n\n<header style=\"position:fixed;top:0;left:0;right:0;z-index:50;background:color-mix(in srgb, var(--color-bg) 82%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--color-divider)\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:14px\">\n    <div style=\"width:26px;height:26px;border-radius:7px;background:#326ce5;display:grid;place-items:center;flex:none\">\n      <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\"><polygon points=\"12,2 20,6.5 20,15.5 12,20 4,15.5 4,6.5\"><\u002Fpolygon><circle cx=\"12\" cy=\"11\" r=\"2.4\"><\u002Fcircle><g stroke-width=\"1\"><line x1=\"12\" y1=\"8.6\" x2=\"12\" y2=\"4.5\"><\u002Fline><line x1=\"14.1\" y1=\"12.2\" x2=\"17.6\" y2=\"14\"><\u002Fline><line x1=\"9.9\" y1=\"12.2\" x2=\"6.4\" y2=\"14\"><\u002Fline><\u002Fg><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;line-height:1.15\">\n      <span style=\"font:600 14px Inter;color:var(--color-text)\">Kubernetes · K8s<\u002Fspan>\n      <span style=\"font:11px Inter;color:var(--color-neutral-500)\">Bài 35 · Module tự học<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:10px\">\n      <span class=\"tag tag-outline\">Beginner<\u002Fspan>\n      <span style=\"font:12px Inter;color:var(--color-neutral-500)\">Author: Yên Nguyễn<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"top\" style=\"position:relative;overflow:hidden;padding:132px 24px 84px;background:radial-gradient(1100px 520px at 72% -8%, var(--color-section-glow) 0%, transparent 60%), radial-gradient(760px 420px at 8% 108%, var(--color-accent-900) 0%, transparent 62%), var(--color-bg)\">\n  <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.25fr .9fr;gap:52px;align-items:center\" class=\"km-grid2\">\n    <div style=\"animation:kmFloat .6s ease both\">\n      <div style=\"display:inline-flex;align-items:center;gap:9px;padding:6px 13px;border:1px solid var(--color-accent-700);border-radius:999px;margin-bottom:22px\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#7fd1a3;box-shadow:0 0 10px #7fd1a3\"><\u002Fspan>\n        <span style=\"font:600 11px Inter;letter-spacing:.12em;color:var(--color-accent-200)\">VTI ACADEMY · WAY TO ENTERPRISE<\u002Fspan>\n      <\u002Fdiv>\n      <h1 class=\"km-hero-title\" style=\"font-size:66px;line-height:1.02;letter-spacing:-.03em;margin:0 0 18px\">Kubernetes<br><span style=\"background:linear-gradient(90deg,#9184d9,#5ec8d8);-webkit-background-clip:text;background-clip:text;color:transparent\">điều phối container<\u002Fspan><\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.6;color:var(--color-neutral-300);max-width:520px;margin:0 0 26px\">Học từ số 0: hiểu <b style=\"color:var(--color-text)\">Kubernetes (K8s)<\u002Fb> là gì, kiến trúc ra sao và cách nó tự động triển khai, mở rộng &amp; tự phục hồi ứng dụng — qua sơ đồ trực quan và ví dụ thực tế.<\u002Fp>\n      <p style=\"font-size:13px;color:var(--color-neutral-500);max-width:520px;margin:0 0 30px\">Learn Kubernetes from scratch — architecture, core objects, networking &amp; deployment, with visual diagrams and hands-on examples.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n        <a href=\"#gioi-thieu\" class=\"btn btn-primary\" style=\"padding:11px 22px;font-size:15px\">Bắt đầu học ↓<\u002Fa>\n        <a href=\"#thuc-hanh\" class=\"btn btn-secondary\" style=\"padding:11px 22px;font-size:15px\">Đi tới phần Thực hành<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:26px;margin-top:34px\">\n        <div><div style=\"font:600 26px Inter;color:#5ec8d8\">12<\u002Fdiv><div style=\"font:12px Inter;color:var(--color-neutral-500)\">phần học<\u002Fdiv><\u002Fdiv>\n        <div style=\"width:1px;background:var(--color-divider)\"><\u002Fdiv>\n        <div><div style=\"font:600 26px Inter;color:#9184d9\">6<\u002Fdiv><div style=\"font:12px Inter;color:var(--color-neutral-500)\">sơ đồ trực quan<\u002Fdiv><\u002Fdiv>\n        <div style=\"width:1px;background:var(--color-divider)\"><\u002Fdiv>\n        <div><div style=\"font:600 26px Inter;color:#7fd1a3\">100%<\u002Fdiv><div style=\"font:12px Inter;color:var(--color-neutral-500)\">Tiếng Việt + EN<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;animation:kmFloat .8s ease both\">\n      <div style=\"position:absolute;inset:-14px;border-radius:26px;background:radial-gradient(circle at 50% 40%,var(--color-accent-800),transparent 70%);filter:blur(18px)\"><\u002Fdiv>\n      <div style=\"position:relative;border:1px solid var(--color-divider);border-radius:20px;overflow:hidden;background:#0f1622;box-shadow:var(--shadow-lg)\">\n        <img src=\"66c24839-a169-487a-8e90-85f595838c1f\" alt=\"Kubernetes điều phối các container Docker\" style=\"width:100%;display:block\">\n        <div style=\"padding:12px 16px;font:12px Inter;color:var(--color-neutral-400);border-top:1px solid var(--color-divider)\">Kubernetes “lái” cả đội tàu container — ví như thuyền trưởng của hạm đội. <span style=\"color:var(--color-neutral-600)\">Source: tài liệu bài học<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"max-width:1180px;margin:0 auto;padding:0 24px 60px\">\n  <div class=\"km-shell\" style=\"display:grid;grid-template-columns:236px 1fr;gap:52px;align-items:start\">\n\n    <aside class=\"km-toc\" style=\"position:sticky;top:84px\">\n      <div style=\"font:600 11px Inter;letter-spacing:.12em;color:var(--color-neutral-500);padding:0 10px 10px\">MỤC LỤC · CONTENTS<\u002Fdiv>\n      <nav style=\"display:flex;flex-direction:column;gap:2px\">\n        <sc-for list=\"{{ toc }}\" as=\"item\" hint-placeholder-count=\"12\">\n          <a href=\"#{{ item.id }}\" style=\"{{ item.style }}\">\n            <span style=\"{{ item.numStyle }}\">{{ item.num }}<\u002Fspan>\n            <span style=\"display:flex;flex-direction:column\"><span>{{ item.vi }}<\u002Fspan><span style=\"font-size:10.5px;color:var(--color-neutral-600)\">{{ item.en }}<\u002Fspan><\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fnav>\n      <div style=\"margin-top:18px;padding:12px 14px;border:1px solid var(--color-divider);border-radius:10px;background:var(--color-surface)\">\n        <div style=\"font:600 12px Inter;color:var(--color-accent-200);margin-bottom:4px\">💡 Mẹo học<\u002Fdiv>\n        <div style=\"font:12px/1.5 Inter;color:var(--color-neutral-400)\">Đọc theo thứ tự, dừng lại ở mỗi khối <b style=\"color:var(--color-text)\">Ví dụ<\u002Fb> và thử hình dung sơ đồ.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <main>\n\n      <!-- 01 -->\n      <section id=\"gioi-thieu\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:52px 0 8px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">01<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">WHAT IS KUBERNETES<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:36px;margin:0 0 14px\">Kubernetes là gì?<\u002Fh2>\n        <p style=\"font-size:17px;line-height:1.65;color:var(--color-neutral-200);max-width:720px\">Kubernetes (viết tắt <b style=\"color:var(--color-text)\">K8s<\u002Fb>) là một nền tảng <b style=\"color:var(--color-text)\">mã nguồn mở<\u002Fb> giúp <b style=\"color:#9184d9\">tự động hoá<\u002Fb> việc triển khai, mở rộng và quản lý các ứng dụng đóng gói dạng <b style=\"color:#5ec8d8\">container<\u002Fb>. Nó điều phối (orchestrate) hàng loạt container trên nhiều máy chủ, đảm bảo ứng dụng luôn sẵn sàng, dễ mở rộng và dùng tài nguyên hiệu quả.<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center;margin-top:30px\" class=\"km-grid2\">\n          <div style=\"border-left:3px solid #5ec8d8;background:linear-gradient(90deg,color-mix(in srgb,#5ec8d8 10%,transparent),transparent);border-radius:0 12px 12px 0;padding:18px 20px\">\n            <div style=\"font:600 12px Inter;letter-spacing:.08em;color:#5ec8d8;margin-bottom:8px\">🎯 VÍ DỤ HÌNH DUNG<\u002Fdiv>\n            <p style=\"margin:0;font-size:15px;line-height:1.65;color:var(--color-neutral-200)\"><b style=\"color:var(--color-text)\">K8s như một nhạc trưởng.<\u002Fb> Mỗi <b>container<\u002Fb> là một nhạc công. Nhạc trưởng (K8s) quyết định ai chơi, khi nào, thay người khi có nhạc công “nghỉ ốm” (container lỗi), và thêm người khi khán phòng đông hơn (tải tăng) — để bản nhạc (ứng dụng) không bao giờ ngắt quãng.<\u002Fp>\n          <\u002Fdiv>\n          <figure style=\"border:1px solid var(--color-divider);border-radius:16px;background:#fff;padding:26px;display:grid;place-items:center\">\n            <img src=\"a43dcf41-ff2e-4151-9b50-b19e899c9b9c\" alt=\"Logo Kubernetes\" style=\"max-width:200px\">\n          <\u002Ffigure>\n        <\u002Fdiv>\n\n        <div class=\"km-grid4\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px\">\n          <div class=\"card elev-sm\"><div class=\"card-kicker\" style=\"color:#9184d9\">Cluster<\u002Fdiv><div style=\"font:13px/1.5 Inter;color:var(--color-neutral-300)\">Cụm gồm nhiều máy (node) chạy chung.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\"><div class=\"card-kicker\" style=\"color:#5ec8d8\">Container<\u002Fdiv><div style=\"font:13px/1.5 Inter;color:var(--color-neutral-300)\">Gói ứng dụng + môi trường chạy độc lập.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\"><div class=\"card-kicker\" style=\"color:#7fd1a3\">Pod<\u002Fdiv><div style=\"font:13px/1.5 Inter;color:var(--color-neutral-300)\">Đơn vị nhỏ nhất chứa 1+ container.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\"><div class=\"card-kicker\" style=\"color:#e0b15e\">Orchestration<\u002Fdiv><div style=\"font:13px/1.5 Inter;color:var(--color-neutral-300)\">Điều phối tự động toàn bộ cụm.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 02 -->\n      <section id=\"ung-dung\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:56px 0 8px;border-top:1px solid var(--color-divider);margin-top:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">02<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">USE CASES · ỨNG DỤNG<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:34px;margin:0 0 14px\">Dùng Kubernetes để làm gì?<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.65;color:var(--color-neutral-300);max-width:720px\">K8s được dùng ở rất nhiều tình huống trong doanh nghiệp — từ vận hành sản phẩm, microservices, đến CI/CD và đa đám mây.<\u002Fp>\n\n        <figure style=\"margin:22px 0 26px;border:1px solid var(--color-divider);border-radius:16px;overflow:hidden;background:#0f1622\">\n          <img src=\"5e68fb63-3742-4a04-8eef-97c670cb9370\" alt=\"Kubernetes điều phối container trên nhiều node phân tán\" style=\"width:100%\">\n          <figcaption style=\"padding:10px 16px;color:var(--color-neutral-500)\">K8s trải các container trên nhiều node phân tán và kết nối chúng thành một hệ thống thống nhất.<\u002Ffigcaption>\n        <\u002Ffigure>\n\n        <div class=\"km-grid3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n          <div class=\"card elev-sm\" style=\"gap:8px\"><div style=\"font-size:22px\">📦<\u002Fdiv><div class=\"card-title\" style=\"font-size:16px\">Quản lý container<\u002Fdiv><div class=\"card-body\">Triển khai &amp; vận hành ứng dụng container hoá trong môi trường <b style=\"color:var(--color-text)\">production<\u002Fb>.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"gap:8px\"><div style=\"font-size:22px\">🧩<\u002Fdiv><div class=\"card-title\" style=\"font-size:16px\">Microservices<\u002Fdiv><div class=\"card-body\">Mỗi dịch vụ nhỏ chạy trong container riêng — nền tảng lý tưởng cho kiến trúc microservices.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"gap:8px\"><div style=\"font-size:22px\">☁️<\u002Fdiv><div class=\"card-title\" style=\"font-size:16px\">Đa đám mây / Hybrid<\u002Fdiv><div class=\"card-body\">Chạy ứng dụng trên public cloud, private cloud và môi trường lai (hybrid).<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"gap:8px\"><div style=\"font-size:22px\">🔁<\u002Fdiv><div class=\"card-title\" style=\"font-size:16px\">CI/CD<\u002Fdiv><div class=\"card-body\">Hỗ trợ tích hợp &amp; triển khai liên tục với Jenkins, GitLab CI, ArgoCD…<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"gap:8px\"><div style=\"font-size:22px\">📈<\u002Fdiv><div class=\"card-title\" style=\"font-size:16px\">Auto-scaling<\u002Fdiv><div class=\"card-body\">Tự động tăng/giảm số bản sao ứng dụng theo tải thực tế.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"gap:8px\"><div style=\"font-size:22px\">🛟<\u002Fdiv><div class=\"card-title\" style=\"font-size:16px\">Self-healing<\u002Fdiv><div class=\"card-body\">Tự khôi phục, khởi động lại container khi có sự cố — chịu lỗi tốt.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 03 -->\n      <section id=\"kien-truc\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:56px 0 8px;border-top:1px solid var(--color-divider);margin-top:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">03<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">ARCHITECTURE · KIẾN TRÚC<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:34px;margin:0 0 14px\">Kiến trúc tổng quan<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.65;color:var(--color-neutral-300);max-width:720px\">Kubernetes theo mô hình <b style=\"color:var(--color-text)\">client–server<\u002Fb> với hai phần chính: <b style=\"color:#9184d9\">Master Node (Control Plane)<\u002Fb> — bộ não điều khiển, và <b style=\"color:#5ec8d8\">Worker Node<\u002Fb> — nơi container thực sự chạy.<\u002Fp>\n\n        <figure class=\"km-diagram\" style=\"margin:26px 0 8px;border:1px solid var(--color-divider);border-radius:16px;background:linear-gradient(180deg,#12131d,#0f1017);padding:20px\">\n          <svg sc-camel-view-box=\"0 0 960 540\" style=\"width:100%;height:auto\" font-family=\"Inter, sans-serif\">\n            <defs>\n              <marker id=\"ar\" sc-camel-marker-width=\"9\" sc-camel-marker-height=\"9\" sc-camel-ref-x=\"7\" sc-camel-ref-y=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#9184d9\"><\u002Fpath><\u002Fmarker>\n              <marker id=\"arc\" sc-camel-marker-width=\"9\" sc-camel-marker-height=\"9\" sc-camel-ref-x=\"7\" sc-camel-ref-y=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#5ec8d8\"><\u002Fpath><\u002Fmarker>\n            <\u002Fdefs>\n            <!-- kubectl -->\n            <rect x=\"350\" y=\"12\" width=\"260\" height=\"46\" rx=\"10\" fill=\"#232532\" stroke=\"#9184d9\"><\u002Frect>\n            <text x=\"480\" y=\"40\" fill=\"#e9e9ed\" font-size=\"14\" font-weight=\"600\" text-anchor=\"middle\">kubectl · Lập trình viên / Admin<\u002Ftext>\n            <path d=\"M480,58 L480,96\" stroke=\"#9184d9\" stroke-width=\"2\" marker-end=\"url(#ar)\"><\u002Fpath>\n            <text x=\"492\" y=\"82\" fill=\"#9397ab\" font-size=\"11\">gửi lệnh (YAML)<\u002Ftext>\n            <!-- control plane -->\n            <rect x=\"24\" y=\"104\" width=\"440\" height=\"410\" rx=\"16\" fill=\"#161826\" stroke=\"#9184d9\" stroke-opacity=\"0.6\"><\u002Frect>\n            <text x=\"46\" y=\"132\" fill=\"#9184d9\" font-size=\"12\" font-weight=\"600\" letter-spacing=\"1\">CONTROL PLANE — MASTER NODE<\u002Ftext>\n            <rect x=\"140\" y=\"150\" width=\"208\" height=\"56\" rx=\"10\" fill=\"#423a6a\" stroke=\"#9184d9\"><\u002Frect>\n            <text x=\"244\" y=\"184\" fill=\"#f5f4ff\" font-size=\"15\" font-weight=\"600\" text-anchor=\"middle\">API Server<\u002Ftext>\n            <!-- etcd cylinder -->\n            <g transform=\"translate(52,250)\"><ellipse cx=\"52\" cy=\"8\" rx=\"52\" ry=\"12\" fill=\"#232532\" stroke=\"#7fd1a3\"><\u002Fellipse><path d=\"M0,8 v60 a52,12 0 0 0 104,0 v-60\" fill=\"#232532\" stroke=\"#7fd1a3\"><\u002Fpath><ellipse cx=\"52\" cy=\"8\" rx=\"52\" ry=\"12\" fill=\"none\" stroke=\"#7fd1a3\"><\u002Fellipse><text x=\"52\" y=\"46\" fill=\"#e9e9ed\" font-size=\"14\" font-weight=\"600\" text-anchor=\"middle\">etcd<\u002Ftext><\u002Fg>\n            <text x=\"52\" y=\"342\" fill=\"#9397ab\" font-size=\"10.5\">DB cấu hình &amp; trạng thái<\u002Ftext>\n            <rect x=\"200\" y=\"256\" width=\"176\" height=\"52\" rx=\"10\" fill=\"#232532\" stroke=\"#7fd1a3\"><\u002Frect>\n            <text x=\"288\" y=\"287\" fill=\"#e9e9ed\" font-size=\"13.5\" text-anchor=\"middle\">Scheduler<\u002Ftext>\n            <rect x=\"200\" y=\"330\" width=\"176\" height=\"52\" rx=\"10\" fill=\"#232532\" stroke=\"#e0b15e\"><\u002Frect>\n            <text x=\"288\" y=\"361\" fill=\"#e9e9ed\" font-size=\"13.5\" text-anchor=\"middle\">Controller Mgr<\u002Ftext>\n            <!-- arrows within CP -->\n            <path d=\"M160,282 L244,210\" stroke=\"#7fd1a3\" stroke-width=\"1.6\" marker-end=\"url(#arc)\" fill=\"none\" opacity=\"0.8\"><\u002Fpath>\n            <path d=\"M244,330 L244,208\" stroke=\"#e0b15e\" stroke-width=\"1.6\" marker-end=\"url(#ar)\" fill=\"none\" opacity=\"0.7\"><\u002Fpath>\n            <path d=\"M200,282 L160,220\" stroke=\"#7fd1a3\" stroke-width=\"1.4\" fill=\"none\" opacity=\"0.5\"><\u002Fpath>\n            <path d=\"M148,206 L120,250\" stroke=\"#9184d9\" stroke-width=\"1.6\" fill=\"none\" opacity=\"0.7\"><\u002Fpath>\n            <!-- worker -->\n            <rect x=\"536\" y=\"128\" width=\"400\" height=\"386\" rx=\"16\" fill=\"#161826\" stroke=\"#5ec8d8\" stroke-opacity=\"0.55\"><\u002Frect>\n            <rect x=\"520\" y=\"112\" width=\"400\" height=\"386\" rx=\"16\" fill=\"#12131d\" stroke=\"#5ec8d8\" stroke-opacity=\"0.8\"><\u002Frect>\n            <text x=\"542\" y=\"140\" fill=\"#5ec8d8\" font-size=\"12\" font-weight=\"600\" letter-spacing=\"1\">WORKER NODE  × N<\u002Ftext>\n            <rect x=\"542\" y=\"156\" width=\"176\" height=\"46\" rx=\"9\" fill=\"#232532\" stroke=\"#5ec8d8\"><\u002Frect>\n            <text x=\"630\" y=\"184\" fill=\"#e9e9ed\" font-size=\"13.5\" text-anchor=\"middle\">Kubelet<\u002Ftext>\n            <rect x=\"730\" y=\"156\" width=\"172\" height=\"46\" rx=\"9\" fill=\"#232532\" stroke=\"#5ec8d8\"><\u002Frect>\n            <text x=\"816\" y=\"184\" fill=\"#e9e9ed\" font-size=\"13.5\" text-anchor=\"middle\">Kube-proxy<\u002Ftext>\n            <rect x=\"542\" y=\"216\" width=\"360\" height=\"44\" rx=\"9\" fill=\"#232532\" stroke=\"#9397ab\"><\u002Frect>\n            <text x=\"722\" y=\"243\" fill=\"#cfd3e5\" font-size=\"13\" text-anchor=\"middle\">Container Runtime (Docker / containerd)<\u002Ftext>\n            <rect x=\"542\" y=\"276\" width=\"360\" height=\"204\" rx=\"12\" fill=\"#0f1622\" stroke=\"#3f424d\"><\u002Frect>\n            <text x=\"560\" y=\"298\" fill=\"#9397ab\" font-size=\"11\" font-weight=\"600\">PODS<\u002Ftext>\n            <g>\n              <rect x=\"560\" y=\"310\" width=\"158\" height=\"152\" rx=\"10\" fill=\"#1b1d2b\" stroke=\"#9184d9\" stroke-opacity=\"0.7\"><\u002Frect>\n              <text x=\"639\" y=\"330\" fill=\"#d2cefd\" font-size=\"12\" text-anchor=\"middle\">Pod<\u002Ftext>\n              <rect x=\"576\" y=\"342\" width=\"52\" height=\"46\" rx=\"6\" fill=\"#326ce5\"><\u002Frect><rect x=\"650\" y=\"342\" width=\"52\" height=\"46\" rx=\"6\" fill=\"#326ce5\"><\u002Frect>\n              <rect x=\"576\" y=\"400\" width=\"126\" height=\"46\" rx=\"6\" fill=\"#5ec8d8\" opacity=\"0.85\"><\u002Frect>\n              <text x=\"639\" y=\"429\" fill=\"#0f1622\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">volume<\u002Ftext>\n            <\u002Fg>\n            <g>\n              <rect x=\"726\" y=\"310\" width=\"158\" height=\"152\" rx=\"10\" fill=\"#1b1d2b\" stroke=\"#9184d9\" stroke-opacity=\"0.7\"><\u002Frect>\n              <text x=\"805\" y=\"330\" fill=\"#d2cefd\" font-size=\"12\" text-anchor=\"middle\">Pod<\u002Ftext>\n              <rect x=\"742\" y=\"342\" width=\"126\" height=\"46\" rx=\"6\" fill=\"#326ce5\"><\u002Frect>\n              <rect x=\"742\" y=\"400\" width=\"126\" height=\"46\" rx=\"6\" fill=\"#5ec8d8\" opacity=\"0.85\"><\u002Frect>\n              <text x=\"805\" y=\"429\" fill=\"#0f1622\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"600\">volume<\u002Ftext>\n            <\u002Fg>\n            <!-- worker to api -->\n            <path d=\"M542,178 C440,178 400,178 352,178\" stroke=\"#5ec8d8\" stroke-width=\"1.8\" fill=\"none\" marker-end=\"url(#arc)\"><\u002Fpath>\n            <path d=\"M730,178 C500,120 420,150 350,168\" stroke=\"#5ec8d8\" stroke-width=\"1.4\" fill=\"none\" opacity=\"0.55\" marker-end=\"url(#arc)\"><\u002Fpath>\n          <\u002Fsvg>\n          <figcaption style=\"padding:8px 6px 0;color:var(--color-neutral-500)\">Sơ đồ kiến trúc K8s (vẽ lại) — Control Plane điều khiển, Worker Node chạy Pod. Kubelet ở mỗi worker báo cáo về API Server.<\u002Ffigcaption>\n        <\u002Ffigure>\n\n        <div style=\"border-left:3px solid #9184d9;background:linear-gradient(90deg,color-mix(in srgb,#9184d9 10%,transparent),transparent);border-radius:0 12px 12px 0;padding:16px 20px;margin-top:22px\">\n          <div style=\"font:600 12px Inter;letter-spacing:.08em;color:#9184d9;margin-bottom:6px\">🎯 VÍ DỤ HÌNH DUNG<\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;line-height:1.65;color:var(--color-neutral-200)\"><b style=\"color:var(--color-text)\">Control Plane = ban điều hành nhà máy<\u002Fb> (ra quyết định, phân công). <b style=\"color:var(--color-text)\">Worker Node = các phân xưởng<\u002Fb> (thực sự sản xuất). Bạn gửi “đơn đặt hàng” bằng lệnh <code style=\"background:#232532;padding:2px 6px;border-radius:5px;color:#5ec8d8\">kubectl<\u002Fcode>, ban điều hành chia việc xuống các phân xưởng.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 04 -->\n      <section id=\"control-plane\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:56px 0 8px;border-top:1px solid var(--color-divider);margin-top:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">04<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">CONTROL PLANE COMPONENTS<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:34px;margin:0 0 14px\">Bộ não của cụm — Control Plane<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.65;color:var(--color-neutral-300);max-width:720px\">Bốn thành phần chính trên Master Node phối hợp để điều khiển toàn cụm.<\u002Fp>\n        <div class=\"km-grid2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px\">\n          <div class=\"card elev-sm\" style=\"border-left:3px solid #9184d9\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:20px\">🚪<\u002Fspan><div class=\"card-title\" style=\"font-size:17px\">API Server<\u002Fdiv><\u002Fdiv><div class=\"card-body\">Cửa ngõ trung tâm để tương tác với K8s — mọi lệnh đều đi qua đây. Cung cấp API cho các thành phần khác.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"border-left:3px solid #e0b15e\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:20px\">👁️<\u002Fspan><div class=\"card-title\" style=\"font-size:17px\">Controller Manager<\u002Fdiv><\u002Fdiv><div class=\"card-body\">Giám sát trạng thái hệ thống, tự điều chỉnh khi có thay đổi (VD: tạo thêm Pod khi cần mở rộng).<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"border-left:3px solid #7fd1a3\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:20px\">📅<\u002Fspan><div class=\"card-title\" style=\"font-size:17px\">Scheduler<\u002Fdiv><\u002Fdiv><div class=\"card-body\">Quyết định Pod nên chạy trên Worker Node nào, dựa trên tài nguyên (CPU/RAM) và các ràng buộc.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"border-left:3px solid #5ec8d8\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:20px\">🗄️<\u002Fspan><div class=\"card-title\" style=\"font-size:17px\">etcd<\u002Fdiv><\u002Fdiv><div class=\"card-body\">Cơ sở dữ liệu phân tán lưu toàn bộ cấu hình &amp; trạng thái cụm — “nguồn sự thật” duy nhất.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 05 -->\n      <section id=\"worker-node\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:56px 0 8px;border-top:1px solid var(--color-divider);margin-top:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">05<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">WORKER NODE &amp; KUBECTL<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:34px;margin:0 0 14px\">Worker Node &amp; kubectl<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.65;color:var(--color-neutral-300);max-width:720px\">Worker Node là nơi container thực thi, được điều khiển bởi Master. Mỗi node có các thành phần sau:<\u002Fp>\n        <div class=\"km-grid3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px\">\n          <div class=\"card elev-sm\"><div class=\"card-kicker\" style=\"color:#5ec8d8\">Kubelet<\u002Fdiv><div class=\"card-body\">Chạy trên mỗi worker, đảm bảo các container được triển khai &amp; chạy đúng theo yêu cầu.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\"><div class=\"card-kicker\" style=\"color:#5ec8d8\">Kube-proxy<\u002Fdiv><div class=\"card-body\">Quản lý mạng giữa các Pod, định tuyến request đến đúng Pod, duy trì Service.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\"><div class=\"card-kicker\" style=\"color:#9397ab\">Container Runtime<\u002Fdiv><div class=\"card-body\">Phần mềm khởi tạo &amp; chạy container (Docker, containerd).<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;border:1px solid var(--color-divider);border-radius:14px;background:var(--color-surface);padding:18px 22px\">\n          <div style=\"width:52px;height:52px;border-radius:12px;background:#12131d;display:grid;place-items:center;font-size:24px\">⌨️<\u002Fdiv>\n          <div>\n            <div style=\"font:600 17px Inter;color:var(--color-text);margin-bottom:4px\">kubectl — công cụ quản trị<\u002Fdiv>\n            <div style=\"font:14px/1.6 Inter;color:var(--color-neutral-300)\">Cài trên máy trạm, cho phép lập trình viên đẩy “bản mô tả triển khai” (YAML) vào cụm, và cho admin quản trị cụm. Đây là <b style=\"color:var(--color-text)\">cách chính<\u002Fb> con người ra lệnh cho Kubernetes.<\u002Fdiv>\n            <div style=\"margin-top:10px;font:13px ui-monospace,Menlo,monospace;background:#12131d;border:1px solid var(--color-divider);border-radius:8px;padding:8px 12px;color:#5ec8d8\">$ kubectl apply -f deploy.yaml<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 06 -->\n      <section id=\"doi-tuong\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:56px 0 8px;border-top:1px solid var(--color-divider);margin-top:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">06<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">CORE OBJECTS · ĐỐI TƯỢNG<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:34px;margin:0 0 14px\">Các đối tượng cốt lõi<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.65;color:var(--color-neutral-300);max-width:720px\">Đây là những “khối xây dựng” bạn làm việc hằng ngày trong Kubernetes.<\u002Fp>\n\n        <div class=\"km-grid2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px\">\n          <div class=\"card elev-sm\"><div class=\"card-title\" style=\"font-size:16px;color:#9184d9\">Pod<\u002Fdiv><div class=\"card-body\">Đơn vị nhỏ nhất &amp; quan trọng nhất. Chứa 1 hoặc nhiều container, có tài nguyên riêng (CPU, RAM, volume, IP mạng). Là nơi ứng dụng chạy.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\"><div class=\"card-title\" style=\"font-size:16px;color:#5ec8d8\">Image<\u002Fdiv><div class=\"card-body\">Ứng dụng đã được đóng gói để chạy dạng container. Pod dùng Image để chạy. Lưu tập trung ở registry như Docker Hub.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\"><div class=\"card-title\" style=\"font-size:16px;color:#7fd1a3\">Deployment<\u002Fdiv><div class=\"card-body\">Cách để triển khai, cập nhật &amp; quản trị Pod một cách khai báo (declarative).<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\"><div class=\"card-title\" style=\"font-size:16px;color:#e0b15e\">ReplicaSet<\u002Fdiv><div class=\"card-body\">Quản trị số bản sao của Pod — nhân bản hoặc giảm số lượng để đạt đúng “replicas” mong muốn.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\"><div class=\"card-title\" style=\"font-size:16px;color:#d98cc0\">Service<\u002Fdiv><div class=\"card-body\">Lớp mạng giúp các Pod gọi nhau ổn định, cân bằng tải, và dẫn traffic người dùng vào ứng dụng.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\"><div class=\"card-title\" style=\"font-size:16px;color:#9397ab\">Label<\u002Fdiv><div class=\"card-body\">Nhãn phân loại &amp; quản lý Pod (VD: <code style=\"color:#5ec8d8\">app=frontend<\u002Fcode>, <code style=\"color:#5ec8d8\">env=production<\u002Fcode>).<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h4 style=\"margin:34px 0 12px;font-size:18px\">Pod bên trong trông như thế nào?<\u002Fh4>\n        <div class=\"km-grid2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch\">\n          <figure class=\"km-diagram\" style=\"margin:0;border:1px solid var(--color-divider);border-radius:14px;background:#12131d;padding:16px\">\n            <svg sc-camel-view-box=\"0 0 460 300\" style=\"width:100%;height:auto\" font-family=\"Inter, sans-serif\">\n              <rect x=\"20\" y=\"20\" width=\"420\" height=\"260\" rx=\"16\" fill=\"#1b1d2b\" stroke=\"#9184d9\"><\u002Frect>\n              <text x=\"40\" y=\"48\" fill=\"#d2cefd\" font-size=\"14\" font-weight=\"600\">Pod<\u002Ftext>\n              <rect x=\"300\" y=\"30\" width=\"120\" height=\"26\" rx=\"13\" fill=\"#232532\" stroke=\"#5ec8d8\"><\u002Frect><text x=\"360\" y=\"48\" fill=\"#5ec8d8\" font-size=\"11\" text-anchor=\"middle\">IP: 10.1.2.7<\u002Ftext>\n              <rect x=\"44\" y=\"70\" width=\"170\" height=\"96\" rx=\"10\" fill=\"#326ce5\"><\u002Frect><text x=\"129\" y=\"122\" fill=\"#fff\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\">Container A<\u002Ftext><text x=\"129\" y=\"142\" fill=\"#dbe6ff\" font-size=\"11\" text-anchor=\"middle\">nginx<\u002Ftext>\n              <rect x=\"246\" y=\"70\" width=\"170\" height=\"96\" rx=\"10\" fill=\"#326ce5\"><\u002Frect><text x=\"331\" y=\"122\" fill=\"#fff\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\">Container B<\u002Ftext><text x=\"331\" y=\"142\" fill=\"#dbe6ff\" font-size=\"11\" text-anchor=\"middle\">log-agent<\u002Ftext>\n              <rect x=\"44\" y=\"188\" width=\"372\" height=\"70\" rx=\"10\" fill=\"#5ec8d8\" opacity=\"0.9\"><\u002Frect><text x=\"230\" y=\"228\" fill=\"#0f1622\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\">Shared Volume + Network (dùng chung)<\u002Ftext>\n            <\u002Fsvg>\n            <figcaption style=\"padding-top:8px;color:var(--color-neutral-500)\">Các container trong cùng Pod chia sẻ IP mạng &amp; volume.<\u002Ffigcaption>\n          <\u002Ffigure>\n          <div style=\"border-radius:12px;overflow:hidden;box-shadow:var(--shadow-md);background:#0e0f18\">\n            <div style=\"display:flex;align-items:center;gap:7px;padding:9px 14px;background:#1b1d2b;border-bottom:1px solid var(--color-divider)\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f57\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#febc2e\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#28c840\"><\u002Fspan><span style=\"font:12px Inter;color:#9397ab;margin-left:6px\">pod.yaml<\u002Fspan><\u002Fdiv>\n            <pre style=\"margin:0;padding:16px 18px;font:13px/1.7 ui-monospace,Menlo,monospace;color:#cdd0e0;overflow:auto\"><code><span style=\"color:#9184d9\">apiVersion<\u002Fspan>: v1\n<span style=\"color:#9184d9\">kind<\u002Fspan>: <span style=\"color:#5ec8d8\">Pod<\u002Fspan>\n<span style=\"color:#9184d9\">metadata<\u002Fspan>:\n  <span style=\"color:#9184d9\">name<\u002Fspan>: nginx-pod\n  <span style=\"color:#9184d9\">labels<\u002Fspan>: { <span style=\"color:#9184d9\">app<\u002Fspan>: <span style=\"color:#7fd1a3\">web<\u002Fspan> }\n<span style=\"color:#9184d9\">spec<\u002Fspan>:\n  <span style=\"color:#9184d9\">containers<\u002Fspan>:\n    - <span style=\"color:#9184d9\">name<\u002Fspan>: nginx\n      <span style=\"color:#9184d9\">image<\u002Fspan>: <span style=\"color:#7fd1a3\">nginx:1.25<\u002Fspan>\n      <span style=\"color:#9184d9\">ports<\u002Fspan>:\n        - <span style=\"color:#9184d9\">containerPort<\u002Fspan>: <span style=\"color:#e0b15e\">80<\u002Fspan><\u002Fcode><\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h4 style=\"margin:34px 0 12px;font-size:18px\">Deployment → ReplicaSet → Pod<\u002Fh4>\n        <figure class=\"km-diagram\" style=\"margin:0;border:1px solid var(--color-divider);border-radius:14px;background:#12131d;padding:20px\">\n          <svg sc-camel-view-box=\"0 0 760 340\" style=\"width:100%;height:auto\" font-family=\"Inter, sans-serif\">\n            <defs><marker id=\"ar2\" sc-camel-marker-width=\"8\" sc-camel-marker-height=\"8\" sc-camel-ref-x=\"6\" sc-camel-ref-y=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#9397ab\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n            <rect x=\"300\" y=\"14\" width=\"160\" height=\"48\" rx=\"10\" fill=\"#423a6a\" stroke=\"#9184d9\"><\u002Frect><text x=\"380\" y=\"43\" fill=\"#f5f4ff\" font-size=\"14\" font-weight=\"600\" text-anchor=\"middle\">Deployment<\u002Ftext>\n            <path d=\"M380,62 L150,120\" stroke=\"#9397ab\" stroke-width=\"1.5\" marker-end=\"url(#ar2)\"><\u002Fpath><path d=\"M380,62 L380,120\" stroke=\"#9397ab\" stroke-width=\"1.5\" marker-end=\"url(#ar2)\"><\u002Fpath><path d=\"M380,62 L610,120\" stroke=\"#9397ab\" stroke-width=\"1.5\" marker-end=\"url(#ar2)\"><\u002Fpath>\n            <g><rect x=\"70\" y=\"126\" width=\"160\" height=\"48\" rx=\"10\" fill=\"#232532\" stroke=\"#7fd1a3\"><\u002Frect><text x=\"150\" y=\"155\" fill=\"#e9e9ed\" font-size=\"13\" text-anchor=\"middle\">ReplicaSet v1<\u002Ftext><\u002Fg>\n            <g><rect x=\"300\" y=\"126\" width=\"160\" height=\"48\" rx=\"10\" fill=\"#232532\" stroke=\"#e0b15e\"><\u002Frect><text x=\"380\" y=\"155\" fill=\"#e9e9ed\" font-size=\"13\" text-anchor=\"middle\">ReplicaSet v2<\u002Ftext><\u002Fg>\n            <g><rect x=\"530\" y=\"126\" width=\"160\" height=\"48\" rx=\"10\" fill=\"#232532\" stroke=\"#d98cc0\"><\u002Frect><text x=\"610\" y=\"155\" fill=\"#e9e9ed\" font-size=\"13\" text-anchor=\"middle\">ReplicaSet v3<\u002Ftext><\u002Fg>\n            <path d=\"M120,174 L100,246\" stroke=\"#9397ab\" stroke-width=\"1.3\" marker-end=\"url(#ar2)\"><\u002Fpath><path d=\"M180,174 L200,246\" stroke=\"#9397ab\" stroke-width=\"1.3\" marker-end=\"url(#ar2)\"><\u002Fpath>\n            <path d=\"M350,174 L330,246\" stroke=\"#9397ab\" stroke-width=\"1.3\" marker-end=\"url(#ar2)\"><\u002Fpath><path d=\"M410,174 L430,246\" stroke=\"#9397ab\" stroke-width=\"1.3\" marker-end=\"url(#ar2)\"><\u002Fpath>\n            <path d=\"M580,174 L560,246\" stroke=\"#9397ab\" stroke-width=\"1.3\" marker-end=\"url(#ar2)\"><\u002Fpath><path d=\"M640,174 L660,246\" stroke=\"#9397ab\" stroke-width=\"1.3\" marker-end=\"url(#ar2)\"><\u002Fpath>\n            <g fill=\"#1b1d2b\"><rect x=\"66\" y=\"250\" width=\"68\" height=\"60\" rx=\"8\" stroke=\"#7fd1a3\"><\u002Frect><rect x=\"166\" y=\"250\" width=\"68\" height=\"60\" rx=\"8\" stroke=\"#7fd1a3\"><\u002Frect><rect x=\"296\" y=\"250\" width=\"68\" height=\"60\" rx=\"8\" stroke=\"#e0b15e\"><\u002Frect><rect x=\"396\" y=\"250\" width=\"68\" height=\"60\" rx=\"8\" stroke=\"#e0b15e\"><\u002Frect><rect x=\"526\" y=\"250\" width=\"68\" height=\"60\" rx=\"8\" stroke=\"#d98cc0\"><\u002Frect><rect x=\"626\" y=\"250\" width=\"68\" height=\"60\" rx=\"8\" stroke=\"#d98cc0\"><\u002Frect><\u002Fg>\n            <g fill=\"#cfd3e5\" font-size=\"12\" text-anchor=\"middle\"><text x=\"100\" y=\"285\">Pod<\u002Ftext><text x=\"200\" y=\"285\">Pod<\u002Ftext><text x=\"330\" y=\"285\">Pod<\u002Ftext><text x=\"430\" y=\"285\">Pod<\u002Ftext><text x=\"560\" y=\"285\">Pod<\u002Ftext><text x=\"660\" y=\"285\">Pod<\u002Ftext><\u002Fg>\n          <\u002Fsvg>\n          <figcaption style=\"padding-top:8px;color:var(--color-neutral-500)\">1 Deployment quản lý nhiều ReplicaSet (mỗi phiên bản), mỗi ReplicaSet giữ đúng số Pod.<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsection>\n\n      <!-- 07 -->\n      <section id=\"luu-tru\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:56px 0 8px;border-top:1px solid var(--color-divider);margin-top:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">07<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">STORAGE · LƯU TRỮ<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:34px;margin:0 0 14px\">Lưu trữ bền vững — PV &amp; PVC<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.65;color:var(--color-neutral-300);max-width:720px\">Pod có thể bị xoá &amp; tạo lại bất cứ lúc nào, nên dữ liệu quan trọng cần được lưu ở nơi bền vững, tách khỏi vòng đời Pod.<\u002Fp>\n        <div class=\"km-grid2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px\">\n          <div class=\"card elev-sm\" style=\"border-left:3px solid #5ec8d8\"><div class=\"card-title\" style=\"font-size:16px\">Persistent Volume (PV)<\u002Fdiv><div class=\"card-body\">Đơn vị lưu trữ do admin cấu hình, cung cấp lưu trữ lâu dài. Ánh xạ tới NFS, iSCSI, hoặc cloud (AWS EBS, Google Persistent Disk). Là tài nguyên độc lập.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"border-left:3px solid #9184d9\"><div class=\"card-title\" style=\"font-size:16px\">Persistent Volume Claim (PVC)<\u002Fdiv><div class=\"card-body\">Yêu cầu sử dụng một phần PV từ ứng dụng. Chỉ định dung lượng &amp; kiểu lưu trữ cần; K8s tìm PV phù hợp và liên kết. Trừu tượng hoá việc quản lý lưu trữ.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <figure class=\"km-diagram\" style=\"margin:22px 0 8px;border:1px solid var(--color-divider);border-radius:14px;background:#12131d;padding:20px\">\n          <svg sc-camel-view-box=\"0 0 860 200\" style=\"width:100%;height:auto\" font-family=\"Inter, sans-serif\">\n            <defs><marker id=\"ar3\" sc-camel-marker-width=\"9\" sc-camel-marker-height=\"9\" sc-camel-ref-x=\"7\" sc-camel-ref-y=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#9184d9\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n            <rect x=\"20\" y=\"70\" width=\"150\" height=\"60\" rx=\"10\" fill=\"#1b1d2b\" stroke=\"#7fd1a3\"><\u002Frect><text x=\"95\" y=\"98\" fill=\"#e9e9ed\" font-size=\"14\" font-weight=\"600\" text-anchor=\"middle\">Pod<\u002Ftext><text x=\"95\" y=\"116\" fill=\"#9397ab\" font-size=\"11\" text-anchor=\"middle\">cần lưu dữ liệu<\u002Ftext>\n            <path d=\"M170,100 L228,100\" stroke=\"#9184d9\" stroke-width=\"2\" marker-end=\"url(#ar3)\"><\u002Fpath><text x=\"199\" y=\"90\" fill=\"#9397ab\" font-size=\"10\" text-anchor=\"middle\">mount<\u002Ftext>\n            <rect x=\"232\" y=\"60\" width=\"180\" height=\"80\" rx=\"10\" fill=\"#232532\" stroke=\"#9184d9\"><\u002Frect><text x=\"322\" y=\"94\" fill=\"#d2cefd\" font-size=\"14\" font-weight=\"600\" text-anchor=\"middle\">PVC<\u002Ftext><text x=\"322\" y=\"114\" fill=\"#9397ab\" font-size=\"11\" text-anchor=\"middle\">yêu cầu 5Gi<\u002Ftext>\n            <path d=\"M412,100 L470,100\" stroke=\"#9184d9\" stroke-width=\"2\" marker-end=\"url(#ar3)\"><\u002Fpath><text x=\"441\" y=\"90\" fill=\"#9397ab\" font-size=\"10\" text-anchor=\"middle\">bind<\u002Ftext>\n            <rect x=\"474\" y=\"60\" width=\"180\" height=\"80\" rx=\"10\" fill=\"#232532\" stroke=\"#5ec8d8\"><\u002Frect><text x=\"564\" y=\"94\" fill=\"#5ec8d8\" font-size=\"14\" font-weight=\"600\" text-anchor=\"middle\">PV<\u002Ftext><text x=\"564\" y=\"114\" fill=\"#9397ab\" font-size=\"11\" text-anchor=\"middle\">10Gi khả dụng<\u002Ftext>\n            <path d=\"M654,100 L712,100\" stroke=\"#9184d9\" stroke-width=\"2\" marker-end=\"url(#ar3)\"><\u002Fpath>\n            <rect x=\"716\" y=\"60\" width=\"128\" height=\"80\" rx=\"10\" fill=\"#1b1d2b\" stroke=\"#e0b15e\"><\u002Frect><text x=\"780\" y=\"94\" fill=\"#e9e9ed\" font-size=\"13\" font-weight=\"600\" text-anchor=\"middle\">Storage<\u002Ftext><text x=\"780\" y=\"114\" fill=\"#9397ab\" font-size=\"10.5\" text-anchor=\"middle\">NFS / EBS<\u002Ftext>\n          <\u002Fsvg>\n          <figcaption style=\"padding-top:8px;color:var(--color-neutral-500)\">Pod → PVC (phiếu yêu cầu) → PV (kho có sẵn) → hệ thống lưu trữ vật lý.<\u002Ffigcaption>\n        <\u002Ffigure>\n        <div style=\"border-left:3px solid #7fd1a3;background:linear-gradient(90deg,color-mix(in srgb,#7fd1a3 10%,transparent),transparent);border-radius:0 12px 12px 0;padding:16px 20px;margin-top:14px\">\n          <div style=\"font:600 12px Inter;letter-spacing:.08em;color:#7fd1a3;margin-bottom:6px\">🎯 VÍ DỤ HÌNH DUNG<\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;line-height:1.65;color:var(--color-neutral-200)\"><b style=\"color:var(--color-text)\">PV là kho hàng<\u002Fb> đã dựng sẵn. <b style=\"color:var(--color-text)\">PVC là phiếu yêu cầu<\u002Fb> “cho tôi thuê 5Gi”. Ứng dụng chỉ cầm phiếu, không cần biết kho nằm ở đâu hay dùng công nghệ gì.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 08 -->\n      <section id=\"workload\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:56px 0 8px;border-top:1px solid var(--color-divider);margin-top:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">08<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">SPECIAL WORKLOADS<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:34px;margin:0 0 14px\">DaemonSet &amp; StatefulSet<\u002Fh2>\n        <div class=\"km-grid2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px\">\n          <div class=\"card elev-sm\" style=\"gap:8px\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:20px\">🛰️<\u002Fspan><div class=\"card-title\" style=\"font-size:17px;color:#5ec8d8\">DaemonSet<\u002Fdiv><\u002Fdiv><div class=\"card-body\">Đảm bảo <b style=\"color:var(--color-text)\">mỗi node<\u002Fb> (hoặc một nhóm node) đều chạy 1 bản sao của Pod. Dùng cho agent giám sát, thu thập log — thứ cần “có mặt ở mọi node”.<\u002Fdiv><\u002Fdiv>\n          <div class=\"card elev-sm\" style=\"gap:8px\"><div style=\"display:flex;align-items:center;gap:10px\"><span style=\"font-size:20px\">🧱<\u002Fspan><div class=\"card-title\" style=\"font-size:17px;color:#e0b15e\">StatefulSet<\u002Fdiv><\u002Fdiv><div class=\"card-body\">Quản lý ứng dụng <b style=\"color:var(--color-text)\">có trạng thái<\u002Fb>: Pod có tên ổn định, IP cố định, lưu trữ bền vững. Dùng cho cơ sở dữ liệu (MySQL, MongoDB…).<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 09 -->\n      <section id=\"networking\" data-toc=\"\" style=\"scroll-margin-top:78px;padding:56px 0 8px;border-top:1px solid var(--color-divider);margin-top:48px\">\n        <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:10px\"><span style=\"font:600 12px Inter;letter-spacing:.14em;color:#9184d9\">09<\u002Fspan><span style=\"font:600 12px Inter;letter-spacing:.14em;color:var(--color-neutral-500)\">NETWORKING &amp; SERVICE<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:34px;margin:0 0 14px\">Mạng &amp; các loại Service<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.65;color:var(--color-neutral-300);max-width:720px\">Service định nghĩa cách các Pod giao tiếp với nhau và với bên ngoài. Có nhiều kiểu triển khai:<\u002Fp>\n\n        <div style=\"overflow-x:auto;margin-top:20px;border:1px solid var(--color-divider);border-radius:12px\">\n          <sc-raw-table class=\"table\" style=\"min-width:560px\">\n            <sc-raw-thead><sc-raw-tr><sc-raw-th>Loại Service<\u002Fsc-raw-th><sc-raw-th>Phạm vi truy cập<\u002Fsc-raw-th><sc-raw-th>Khi nào dùng<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-raw-tr><sc-raw-td style=\"color:#7fd1a3;font-weight:600\">ClusterIP <span style=\"font-weight:400;color:var(--color-neutral-500)\">(mặc định)<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Chỉ trong cụm<\u002Fsc-raw-td><sc-raw-td>Pod gọi Pod nội bộ<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"color:#5ec8d8;font-weight:600\">NodePort<\u002Fsc-raw-td><sc-raw-td>Ngoài cụm qua cổng tĩnh trên node<\u002Fsc-raw-td><sc-raw-td>Truy cập nhanh khi test / dev<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"color:#9184d9;font-weight:600\">LoadBalancer<\u002Fsc-raw-td><sc-raw-td>Ngoài cụm qua LB của cloud<\u002Fsc-raw-td><sc-raw-td>Production trên cloud (AWS/GCP)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-td style=\"color:#d98cc0;font-weight:600\">Headless<\u002Fsc-raw-td><sc-raw-td>Truy cập trực tiếp Pod qua DNS<\u002Fsc-raw-td><sc-raw-td>Ứng dụng stateful (DB cluster)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n\n        <figure class=\"km-diagram\" style=\"margin:24px 0 8px;border:1px solid var(--color-divider);border-radius:14px
