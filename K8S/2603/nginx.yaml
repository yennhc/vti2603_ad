apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
  namespace: nginx-web
spec:
  replicas: 3
  selector:
    matchLabels: { app: nginx-web }
  template:
    metadata:
      labels: { app: nginx-web }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-web-svc
spec:
  type: NodePort
  selector: { app: nginx-web }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
